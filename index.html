<!doctype html>
<html lang="en">
  <head>
    <title>&lt;model-viewer&gt; template</title>
    <meta charset="utf-8">
    <meta name="description" content="&lt;model-viewer&gt; template">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link type="text/css" href="./styles.css" rel="stylesheet"/>
  </head>
  <body>
    <!-- <model-viewer> HTML element -->
    <model-viewer src="GHS_animiert.glb" ar ar-modes="scene-viewer webxr quick-look" camera-controls tone-mapping="neutral" poster="poster.webp" shadow-intensity="1.18" exposure="1.09" autoplay>
      <div class="progress-bar hide" slot="progress-bar">
          <div class="update-bar"></div>
      </div>
      <button slot="ar-button" id="ar-button">
          View in your space
      </button>
      <div id="ar-prompt">
          <img src="ar_hand_prompt.png">
      </div>
    </model-viewer>

    <!-- Video-Button -->
    <button id="video-button" type="button">Video abspielen</button>

    <!-- Video-Overlay (startet im Vollbild, Video wird vorab geladen) -->
    <div id="video-overlay" role="dialog" aria-modal="true" aria-label="Video">
      <button id="video-close" type="button" aria-label="Schließen">&times;</button>
      <video id="video-player" src="videos/video1.mp4" controls playsinline preload="auto"></video>
    </div>

    <script src="script.js"></script>
    <script>
      (function () {
        var overlay = document.getElementById('video-overlay');
        var player = document.getElementById('video-player');

        // Video schon beim Seitenaufruf laden
        player.load();

        function enterFullscreen() {
          if (overlay.requestFullscreen) {
            overlay.requestFullscreen().catch(function () {});
          } else if (overlay.webkitRequestFullscreen) {
            overlay.webkitRequestFullscreen();
          } else if (player.webkitEnterFullscreen) {
            // iPhone Safari: nur das Video selbst kann Vollbild
            player.webkitEnterFullscreen();
          }
        }

        function exitFullscreen() {
          if (document.fullscreenElement && document.exitFullscreen) {
            document.exitFullscreen().catch(function () {});
          } else if (document.webkitFullscreenElement && document.webkitExitFullscreen) {
            document.webkitExitFullscreen();
          }
        }

        function openVideo() {
          overlay.classList.add('open');
          enterFullscreen();
          player.currentTime = 0;
          player.play().catch(function () {});
        }

        function closeVideo() {
          player.pause();
          overlay.classList.remove('open');
          exitFullscreen();
        }

        document.getElementById('video-button').addEventListener('click', openVideo);
        document.getElementById('video-close').addEventListener('click', closeVideo);

        // Video zu Ende -> zurück zum Modell
        player.addEventListener('ended', closeVideo);

        // Vollbild per ESC / Geste verlassen -> Overlay schließen
        function onFsChange() {
          var fs = document.fullscreenElement || document.webkitFullscreenElement;
          if (!fs && overlay.classList.contains('open')) closeVideo();
        }
        document.addEventListener('fullscreenchange', onFsChange);
        document.addEventListener('webkitfullscreenchange', onFsChange);
        // iPhone: Vollbild des Videos beendet
        player.addEventListener('webkitendfullscreen', closeVideo);
      })();
    </script>

    <!-- Loads <model-viewer> for browsers: -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
  </body>
</html>
